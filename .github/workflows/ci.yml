name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependências
        run: |
          npm ci
          pip install -r backend/requirements.txt
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt; fi
          pip install pytest

      - name: Motor do jogo em JavaScript
        run: npm test

      - name: Migrations e RLS (Postgres embutido)
        run: npm run test:db

      - name: Backend (API, motor Python, multiplayer)
        run: npm run test:api
        env:
          SUPABASE_URL: ""
          APP_ENV: development
